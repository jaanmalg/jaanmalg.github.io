<style>
/* Layout (from Jaan's Claude Design mockup): narrow icon sidebar + top bar with search + one scrolling work area; record card opens as a right drawer. */
:root{
  --bg:#F7F9FA; --surface:#FFFFFF; --surface-2:#F1F4F6; --line:#E4E9ED; --line-strong:#D2D9DF;
  --ink:#121A21; --ink-2:#44505B; --ink-3:#66727D;
  --accent:#7FB8D6; --accent-ink:#2A6F95; --accent-soft:#EAF3F8; --on-accent:#0B2736;
  --ok:#3B9A6B; --ok-soft:#E5F2EB; --due:#D2932A; --due-soft:#FBF3E4; --due-ink:#8A5B12; --risk:#C2524A; --risk-soft:#F8E6E4; --risk-ink:#A33F38;
  --sample:#8B7BD0; --lead:#7FB8D6; --none:#AEB7BF;
  --map-bg:#E9F2F7; --map-land:#FFFFFF;
  --font:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-display:var(--font); --f-body:var(--font); --f-mono:var(--font);
  --r:8px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1215; --surface:#14191D; --surface-2:#1A2025; --line:#232B31; --line-strong:#313B42;
  --ink:#E7ECF0; --ink-2:#B4BEC6; --ink-3:#8C98A2;
  --accent:#7FB8D6; --accent-ink:#9DCBE3; --accent-soft:#15303D; --on-accent:#0B2736;
  --ok:#4FB383; --ok-soft:#14291F; --due:#E0A43E; --due-soft:#2A2214; --due-ink:#E8BF73; --risk:#D86A61; --risk-soft:#2E1A18; --risk-ink:#EB8C84;
  --sample:#A497E0; --lead:#7FB8D6; --none:#6E7983;
  --map-bg:#101E26; --map-land:#161C21; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1215; --surface:#14191D; --surface-2:#1A2025; --line:#232B31; --line-strong:#313B42;
  --ink:#E7ECF0; --ink-2:#B4BEC6; --ink-3:#8C98A2;
  --accent:#7FB8D6; --accent-ink:#9DCBE3; --accent-soft:#15303D; --on-accent:#0B2736;
  --ok:#4FB383; --ok-soft:#14291F; --due:#E0A43E; --due-soft:#2A2214; --due-ink:#E8BF73; --risk:#D86A61; --risk-soft:#2E1A18; --risk-ink:#EB8C84;
  --sample:#A497E0; --lead:#7FB8D6; --none:#6E7983;
  --map-bg:#101E26; --map-land:#161C21; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;font-feature-settings:"cv11","ss01"}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.i{flex:none;display:block}
.mono,.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-3)}
.small{font-size:12.5px}
p{margin:0}
a{color:var(--accent-ink)}
/* shell */
.app{display:flex;height:100%}
.side{width:76px;flex:none;border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;padding-block:16px;gap:4px;padding-left:env(safe-area-inset-left,0px)}
.logo{width:36px;height:36px;border-radius:8px;background:var(--accent);display:grid;place-items:center;color:var(--on-accent);margin-bottom:14px}
.nav{display:flex;flex-direction:column;gap:2px;width:100%;align-items:center}
.nav button{position:relative;width:64px;border:0;background:none;border-radius:8px;padding:8px 0 6px;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--ink-3);font-size:10.5px;letter-spacing:.01em}
.nav button:hover{color:var(--ink);background:var(--surface-2)}
.nav button[aria-current="page"]{color:var(--accent-ink);background:var(--accent-soft)}
.nav .badge{position:absolute;top:4px;right:10px;min-width:16px;height:16px;border-radius:8px;background:var(--due);color:#fff;font-size:10px;font-weight:600;display:grid;place-items:center;padding:0 4px}
.side .spacer{flex:1}
.iconbtn{width:36px;height:36px;border:1px solid var(--line);background:var(--surface);border-radius:8px;display:grid;place-items:center;color:var(--ink-2)}
.iconbtn:hover{border-color:var(--line-strong);color:var(--ink)}
.main{flex:1;min-width:0;display:flex;flex-direction:column;height:100%}
.top{display:flex;align-items:center;gap:12px;padding-block:12px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--surface)}
.search{position:relative;flex:1;max-width:520px;min-width:0}
.top .search input{width:100%;height:36px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);padding:0 12px 0 36px;outline:none}
.top .search input:focus{border-color:var(--accent);background:var(--surface)}
.search .i{position:absolute;left:11px;top:10px;color:var(--ink-3)}
.sres{position:absolute;top:42px;left:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:8px;z-index:30;padding:6px;box-shadow:0 8px 24px rgba(18,26,33,.08)}
.sres button{display:flex;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:6px;gap:10px;align-items:center;justify-content:space-between}
.sres button:hover,.sres button:focus-visible{background:var(--surface-2)}
.top .grow{flex:1}
.topdate{color:var(--ink-3);font-size:13px;white-space:nowrap}
.view{flex:1;overflow:auto;padding-block:28px 64px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.wrap{max-width:1320px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
/* type */
h1{font-size:24px;font-weight:600;letter-spacing:-.015em;margin:0;text-wrap:balance}
h2{font-size:15px;font-weight:600;margin:0;letter-spacing:-.005em}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);font-weight:500}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.head p{margin:4px 0 0;color:var(--ink-3)}
/* buttons & fields */
.btn{height:34px;padding:0 14px;border-radius:8px;border:1px solid var(--line-strong);background:var(--surface);display:inline-flex;align-items:center;gap:8px;white-space:nowrap;font-weight:500;font-size:13px;color:var(--ink);text-decoration:none}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(.96)}
.btn.ghost{border-color:transparent;background:none;color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{color:var(--risk-ink)}
.btn.small,.btn.sm{height:28px;padding:0 10px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:default}
input[type=text],input[type=email],input[type=tel],input[type=date],input[type=number],input[type=search],select,textarea{background:var(--surface);border:1px solid var(--line-strong);border-radius:8px;padding:7px 10px;width:100%;min-width:0;font-size:13.5px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
textarea{resize:vertical;min-height:70px;line-height:1.5}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--ink-3);min-width:0}
.sel{height:32px;width:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:0 28px 0 10px;font-size:13px;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),linear-gradient(135deg,var(--ink-3) 50%,transparent 50%);background-position:calc(100% - 14px) 14px,calc(100% - 10px) 14px;background-size:4px 4px;background-repeat:no-repeat}
/* status */
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none;background:var(--none)}
.dot.active{background:var(--ok)}.dot.risk{background:var(--due)}.dot.lost{background:var(--risk)}.dot.lead{background:var(--lead)}.dot.sample{background:var(--sample)}.dot.none{background:var(--none)}
.st{display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.chip{display:inline-flex;align-items:center;gap:6px;height:20px;padding:0 7px;border-radius:5px;background:var(--surface-2);font-size:11.5px;color:var(--ink-2);white-space:nowrap}
.chip.st-sent,.chip.st-replied{background:var(--accent-soft);color:var(--accent-ink)}
.chip.st-sample{background:color-mix(in srgb,var(--sample) 16%,transparent);color:var(--ink)}
.chip.st-trial,.chip.st-repeat,.chip.st-regular{background:var(--ok-soft);color:var(--ok)}
.chip.rel-at_risk{background:var(--due-soft);color:var(--due-ink)}
.chip.rel-lost{background:var(--risk-soft);color:var(--risk-ink)}
.chip.rel-dormant{color:var(--ink-3)}
.pri{display:inline-grid;place-items:center;min-width:26px;height:20px;padding:0 5px;border:1px solid var(--line-strong);border-radius:5px;font-size:11px;font-weight:600;color:var(--ink-2)}
.pri.p-Ap,.pri.p-A{border-color:var(--accent);color:var(--accent-ink)}
/* panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel h2{font-size:14px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.kpi{padding:18px 20px;border-left:1px solid var(--line);min-width:0}
.kpi:first-child{border-left:0}
.kpi .v{font-size:26px;font-weight:600;letter-spacing:-.02em;margin-top:6px;display:flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12.5px;color:var(--ink-3);margin-top:2px}
.banner{background:var(--accent-soft);border-radius:8px;padding:11px 13px;font-size:13px;display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.banner.warn{background:var(--due-soft);color:var(--due-ink)}
/* today */
.today-grid{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:24px;align-items:start}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.hints{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.hcard{border:1px solid var(--line);border-radius:var(--r);padding:16px;background:var(--surface);display:flex;flex-direction:column;gap:12px;position:relative;min-width:0}
.hcard.wide{grid-column:1/-1}
.hcard .k{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--ink-3)}
.hcard .k .i{color:var(--accent-ink)}
.hcard.k-risk .k .i{color:var(--due)}
.hcard.k-sample .k .i{color:var(--sample)}
.hcard .t{font-size:14px;color:var(--ink);padding-right:18px}
.hcard .t b{font-weight:600}
.hcard .t a{color:var(--ink);text-decoration:none;font-weight:600;cursor:pointer}
.hcard .t a:hover{text-decoration:underline}
.hcard .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}
.hcard .x{position:absolute;right:8px;top:8px;border:0;background:none;color:var(--ink-3);padding:4px;border-radius:6px}
.hcard .x:hover{background:var(--surface-2);color:var(--ink)}
.mini{display:flex;flex-direction:column}
.mini .mr{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.mini .mr:first-child{border-top:0}
.mini .mr a{color:var(--ink);text-decoration:none;font-weight:500;cursor:pointer}
.tlist{display:flex;flex-direction:column}
.trow{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.trow:first-child{border-top:0}
.cb{appearance:none;width:18px;height:18px;border:1.5px solid var(--line-strong);border-radius:5px;margin:1px 0 0;flex:none;display:grid;place-items:center;cursor:pointer;background:var(--surface)}
.cb:checked{background:var(--accent);border-color:var(--accent)}
.cb:checked::after{content:"";width:9px;height:5px;border-left:1.8px solid var(--on-accent);border-bottom:1.8px solid var(--on-accent);transform:rotate(-45deg) translate(1px,-1px)}
.tt{flex:1;min-width:0;overflow-wrap:anywhere}
.tmeta{font-size:12px;color:var(--ink-3);display:flex;gap:8px;flex-wrap:wrap;margin-top:2px}
.tmeta a{color:var(--accent-ink);text-decoration:none;cursor:pointer}
.tmeta .late{color:var(--risk-ink)}
.tpl{display:flex;flex-direction:column;gap:8px}

const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d);};
const daysSince=s=>Math.round((parse(today())-parse(s))/864e5);
const fmt=s=>{if(!s) return "—";const d=parse(s);const y=d.getFullYear()===new Date().getFullYear()?"":"."+String(d.getFullYear()).slice(2);return pad(d.getDate())+"."+pad(d.getMonth()+1)+y;};
const nextThu=()=>{const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()+((4-d.getDay()+7)%7));return iso(d);};
const eur=n=>n.toFixed(2).replace(".",",")+" €";
const ago=s=>{if(!s) return "—";const n=daysSince(s);if(n===0) return "сегодня";if(n===1) return "вчера";if(n<0) return "через "+(-n)+" дн.";return n+" дн. назад";};
const isCust=v=>CUST.includes(v.stage);
const vById=id=>S.venues.find(v=>v.id===id);
function toast(msg){const r=document.getElementById("toastRoot");r.innerHTML='<div class="toast" role="status">'+esc(msg)+'</div>';clearTimeout(toast.t);toast.t=setTimeout(()=>{r.innerHTML="";},2600);}

/* ---------- hints engine ---------- */
function ordersFor(id){return S.orders.filter(o=>o.venueId===id);}
function computeHints(){
  const t=today(),st=S.settings,thu=nextThu(),dow=new Date().getDay();
  const H={due:[],sample:[],follow:[],risk:[],thu:[],thuToday:[],data:[]};
  for(const v of S.venues){
    if(v.archive) continue;
    const sn=v.snooze||{}; const snz=k=>sn[k]&&sn[k]>t;
    if(v.nextAction&&v.nextActionAt&&v.nextActionAt<=t&&!snz("due")){
      const late=daysSince(v.nextActionAt);
      H.due.push({v,k:"due",why:v.nextAction+(late>0?` · просрочено на ${late} дн.`:" · на сегодня")});
    }
    if(v.stage==="sample"){
      if(!v.sampleAt) H.data.push({v,why:"стадия «Образец», но не указана дата образца"});
      else{
        const d=daysSince(v.sampleAt), after=v.lastContactAt&&v.lastContactAt>v.sampleAt;
        if(d>=st.sampleDays&&!after&&!snz("sample")) H.sample.push({v,k:"sample",tpl:"sample",why:`образец ${fmt(v.sampleAt)} · ${d} дн. без фидбека`});
      }
    }
    if(v.stage==="sent"){
      if(!v.lastContactAt) H.data.push({v,why:"написали, но дата письма не указана"});
      else{const d=daysSince(v.lastContactAt);
        if(d>=st.followUpDays&&!snz("follow")) H.follow.push({v,k:"follow",tpl:"follow",why:`письмо ${fmt(v.lastContactAt)} · ${d} дн. без ответа`});}
    }
    if(isCust(v)&&v.managedBy!=="other"){
      if(!v.lastOrderAt) H.data.push({v,why:"клиент без даты последнего заказа — правило «под риском» не работает"});
      else{
        const w=Math.floor(daysSince(v.lastOrderAt)/7);
        const rel=v.relation||"";
        const recent=v.lastContactAt&&v.lastContactAt>v.lastOrderAt&&daysSince(v.lastContactAt)<st.riskRecontactDays;
        if(!snz("risk")&&!recent&&rel!=="lost"){
          if(w>=st.dormantWeeks&&rel!=="dormant") H.risk.push({v,k:"risk",tpl:"risk",suggest:"dormant",why:`${w} нед. без заказа (последний ${fmt(v.lastOrderAt)})`});
          else if(w>=st.atRiskWeeks&&rel!=="at_risk"&&rel!=="dormant") H.risk.push({v,k:"risk",tpl:"risk",suggest:"at_risk",why:`${w} нед. без заказа (последний ${fmt(v.lastOrderAt)})`});
          else if(rel==="at_risk"||rel==="dormant") H.risk.push({v,k:"risk",tpl:"risk",why:`${REL_L[rel]} · ${w} нед. без заказа`});
        }
      }
      const rel=v.relation||"";
      const regularish=rel==="active"||v.stage==="regular"||v.stage==="repeat";
      if(dow>=1&&dow<=3&&regularish&&rel!=="lost"&&rel!=="dormant"&&rel!=="at_risk"&&!ordersFor(v.id).some(o=>o.deliveryDate===thu)&&!snz("thu"))
        H.thu.push({v,k:"thu",tpl:"thu",why:`доставка ${fmt(thu)} · заказа на этот четверг нет`});
    }
    if(v.stage==="new"&&!v.email&&!v.phone) H.data.push({v,why:"нет email и телефона"});
  }
  if(dow===4){for(const o of S.orders){if(o.deliveryDate===t){const v=vById(o.venueId);if(v) H.thuToday.push({v,o});}}}
  return H;
}
function hintCount(H){const dow=new Date().getDay();return H.sample.length+H.follow.length+H.risk.length+(dow>=1&&dow<=3&&H.thu.length?1:0)+(H.thuToday.length?1:0);}

/* ---------- db writes ---------- */
function guard(){if(!S.db){toast("База недоступна");return false;}if(S.readonly){toast("Только просмотр — изменения недоступны");return false;}return true;}
async function upd(id,data){if(!guard()) return;try{await S.db.collection("venues").doc(id).update({...data,updatedAt:new Date().toISOString()});}catch(e){fail(e);}}
function fail(e){console.error(e);if(e&&e.code==="invalid_argument"&&S.readonly===null){S.readonly=true;}toast(e&&e.code==="quota_exceeded"?"База заполнена — удалите лишние записи":"Не сохранилось: "+((e&&e.message)||"ошибка"));}
async function logAct(v,type,text,date,extra){
  if(!guard()) return;
  date=date||today();
  try{
    await S.db.collection("activities").add({venueId:v.id,type,text:text||"",date,createdAt:new Date().toISOString()});
    const patch={...(extra||{})};
    if(["email","call","meeting","reply"].includes(type)&&(!v.lastContactAt||date>=v.lastContactAt)) patch.lastContactAt=date;
    if(type==="email"&&v.stage==="new") patch.stage="sent";
    if(type==="reply"&&STAGE_I[v.stage]<STAGE_I.replied) patch.stage="replied";
    if(type==="sample"){patch.sampleAt=date;if(STAGE_I[v.stage]<STAGE_I.sample) patch.stage="sample";}
    if(Object.keys(patch).length) await upd(v.id,patch);
  }catch(e){fail(e);}
}
async function snooze(v,k,days,until){await upd(v.id,{snooze:{[k]:until||addDays(today(),days)}});}

function tasksFor(){return S.venues.filter(v=>!v.archive&&v.nextAction).map(v=>({v})).sort((a,b)=>(a.v.nextActionAt||"9").localeCompare(b.v.nextActionAt||"9"));}
function orderSumEur(o){return SKUS.reduce((a,k)=>a+((o.items||{})[k[0]]||0)*k[2],0);}
function todayQueue(H){
  const t=today(),wk=addDays(t,7),Q=new Map();
  const add=(v,o)=>{if(!v||v.archive) return;const q=Q.get(v.id)||{v,items:[],u:"week",due:""};q.items.push(o);
    const rank={late:0,today:1,week:2};if(rank[o.u]<rank[q.u]) q.u=o.u;if(o.due&&(!q.due||o.due<q.due)) q.due=o.due;Q.set(v.id,q);};
  for(const v of S.venues){
    if(v.archive||!v.nextAction) continue;
    const d=v.nextActionAt||"";
    if(d&&d<t) add(v,{kind:"task",u:"late",what:v.nextAction,why:`срок ${fmt(d)} · просрочено на ${daysSince(d)} дн.`,due:d});
    else if(d===t) add(v,{kind:"task",u:"today",what:v.nextAction,why:"срок сегодня",due:d});
    else if(!d||d<=wk) add(v,{kind:"task",u:"week",what:v.nextAction,why:d?`срок ${fmt(d)}`:"без срока",due:d});
  }
  for(const x of H.sample) add(x.v,{kind:"hint",k:"sample",tpl:"sample",u:"today",what:"Спросить фидбек по образцу",why:x.why});
  for(const x of H.follow) add(x.v,{kind:"hint",k:"follow",tpl:"follow",u:daysSince(x.v.lastContactAt)>=14?"late":"today",what:"Follow-up",why:x.why});
  for(const x of H.risk) add(x.v,{kind:"hint",k:"risk",tpl:"risk",u:"today",what:"Давно не заказывали",why:x.why,suggest:x.suggest});
  for(const dr of S.drafts) if(dr.status==="new"&&dr.kind!=="social"&&!Q.has(dr.venueId)){const v=vById(dr.venueId);if(v) add(v,{kind:"draft",u:"today",what:DK_L[dr.kind]||"Письмо",why:dr.reason?dr.reason.split(/[.;]/)[0]:"черновик агента"});}
  const list=[...Q.values()];
  for(const q of list){q.draft=draftFor(q.v.id);q.main=q.items.find(i=>i.kind==="task")||q.items[0];
    q.mail=!!q.draft||q.items.some(i=>i.kind==="hint"&&i.tpl)||(q.main.kind==="task"&&isMailTask(q.v));}
  list.sort((a,b)=>(a.due||"9").localeCompare(b.due||"9")||(a.v.name||"").localeCompare(b.v.name||""));
  return list;
}

function plPack(n){const m10=n%10,m100=n%100;return m10===1&&m100!==11?"пачка":(m10>=2&&m10<=4&&(m100<10||m100>=20)?"пачки":"пачек");}
function packSplit(q,n){q=Math.max(0,Math.floor(q||0));if(!n) return {full:0,rest:q,up:0};n=Math.max(1,Math.floor(n));return {full:Math.floor(q/n),rest:q%n,up:Math.ceil(q/n)};}

const pctS=(a,b)=>b?Math.round(a/b*100)+"%":"—";
function monday(s){const d=parse(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return iso(d);}
function niceMax(m){if(m<=0) return 1;const st=Math.pow(10,Math.floor(Math.log10(m/4)));for(const k of [1,2,2.5,5,10]){if(k*st*4>=m) return k*st*4;}return m;}
function statsData(){
  const st=S.st,t=today();
  const ownOk=v=>st.own==="all"||(st.own==="other"?v.managedBy==="other":v.managedBy!=="other");
  const vs=S.venues.filter(ownOk);
  const ids=new Set(vs.map(v=>v.id));
  const days=st.per==="all"?null:+st.per;
  const from=days?addDays(t,-days):null;
  const ordAll=S.orders.filter(o=>ids.has(o.venueId)&&o.status!=="cancelled");
  const ord=ordAll.filter(o=>days?(o.deliveryDate&&o.deliveryDate>=from):true);
  const acts=S.acts.filter(a=>ids.has(a.venueId)&&(!days||(a.date&&a.date>=from)));
  /* weeks */
  const end=monday(nextThu());
  let start;
  if(days) start=monday(from);
  else{const ds=ordAll.map(o=>o.deliveryDate).concat(S.acts.filter(a=>ids.has(a.venueId)).map(a=>a.date)).filter(Boolean).sort();start=ds.length?monday(ds[0]):addDays(end,-7*11);}
  if(start<addDays(end,-7*25)) start=addDays(end,-7*25);
  const weeks=[];for(let w=start;w<=end;w=addDays(w,7)) weeks.push(w);
  return {vs,ids,from,days,ordAll,ord,acts,weeks};
}

function hbars(rows,max){
  return `<div class="hb">${rows.map(r=>`<div class="hbr" data-tip="${esc(r.tip||"")}"${r.id?` data-open="${r.id}" role="button" tabindex="0"`:""}><span class="hbl">${esc(r.l)}</span><span class="hbt"><span class="hbf" style="width:${r.v>0?Math.max(1.5,r.v/max*100):0}%"></span></span><span class="hbv num">${esc(r.txt)}</span></div>`).join("")}</div>`;
}
function colChart(el,cfg){
  const W=Math.max(280,el.clientWidth),H=el.clientHeight||220,L=52,R=6,T=10,B=24,n=cfg.labels.length,k=cfg.series.length;
  const max=niceMax(Math.max(0,...cfg.series.flatMap(s=>s.vals)));
  const ih=H-T-B,cw=(W-L-R)/n,bw=Math.max(3,Math.min(26,(cw*.72-2*(k-1))/k)),y=v=>T+ih-(v/max)*ih;
  let s=`<svg width="${W}" height="${H}" role="img" aria-label="${esc(cfg.series.map(x=>x.name).join(", "))}">`;
  for(let i=0;i<=4;i++){const v=max*i/4,yy=y(v);s+=`<line class="gl" x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}"/><text class="ax" x="${L-8}" y="${yy+4}" text-anchor="end">${esc(cfg.yf(v))}</text>`;}
  const every=Math.ceil(n/Math.max(1,Math.floor((W-L-R)/44)));
  for(let i=0;i<n;i++){
    const x0=L+i*cw,gw=k*bw+2*(k-1),gx=x0+(cw-gw)/2;
    const tip=[cfg.labels[i],...cfg.series.map(se=>(k>1?se.name+": ":"")+se.f(se.vals[i])),cfg.extra&&cfg.extra[i]].filter(Boolean).join("\n");
    s+=`<g class="cg" data-tip="${esc(tip)}"><rect class="hit" x="${x0}" y="${T}" width="${cw}" height="${ih}"/>`;
    cfg.series.forEach((se,j)=>{const v=se.vals[i];if(!(v>0)) return;const bx=gx+j*(bw+2),by=y(v),bh=T+ih-by,r=Math.min(4,bw/2,bh);
      s+=`<path class="bar ${se.c}" d="M${bx},${T+ih}V${by+r}Q${bx},${by} ${bx+r},${by}H${bx+bw-r}Q${bx+bw},${by} ${bx+bw},${by+r}V${T+ih}Z"/>`;});
    s+=`</g>`;
    if(i%every===0||i===n-1&&n<=every) s+=`<text class="ax" x="${x0+cw/2}" y="${H-6}" text-anchor="middle">${esc(cfg.labels[i])}</text>`;
  }
  s+=`<line class="base" x1="${L}" x2="${W-R}" y1="${T+ih}" y2="${T+ih}"/></svg>`;
  el.innerHTML=s;
}
function drawStats(){if(S.tab!=="stats"||!S.stCharts) return;document.querySelectorAll("[data-chart]").forEach(el=>{const c=S.stCharts[el.dataset.chart];if(c) colChart(el,c);});}

/* tooltip for [data-tip] */
(function(){let tipEl=null;
  const show=(t,x,y)=>{if(!tipEl){tipEl=document.createElement("div");tipEl.className="vtip";document.body.appendChild(tipEl);}tipEl.textContent=t;tipEl.hidden=false;const w=tipEl.offsetWidth,h=tipEl.offsetHeight;let lx=x+14,ly=y-h-10;if(lx+w>innerWidth-8) lx=x-w-14;if(ly<8) ly=y+16;tipEl.style.left=lx+"px";tipEl.style.top=ly+"px";};
  document.addEventListener("pointermove",e=>{const t=e.target.closest&&e.target.closest("[data-tip]");if(t&&t.dataset.tip){show(t.dataset.tip,e.clientX,e.clientY);}else if(tipEl) tipEl.hidden=true;});
  document.addEventListener("pointerleave",()=>{if(tipEl) tipEl.hidden=true;});
  document.addEventListener("scroll",()=>{if(tipEl) tipEl.hidden=true;},true);
})();

/* ---------- view: venues ---------- */
function filtered(){
  const f=S.f,q=f.q.trim().toLowerCase();
  let list=S.venues.filter(v=>{
    if(f.arch==="work"&&v.archive) return false;
    if(f.arch==="arch"&&!v.archive) return false;
    if(f.stage&&v.stage!==f.stage) return false;
    if(f.pri&&(v.priority||"")!==(f.pri==="none"?"":f.pri)) return false;
    if(q){const hay=[v.name,...(v.aliases||[]),v.area,v.contactName,v.email,v.group,v.notes].join(" ").toLowerCase();if(!hay.includes(q)) return false;}
    return true;
  });
  const by={name:(a,b)=>a.name.localeCompare(b.name,"et"),
    contact:(a,b)=>(a.lastContactAt||"").localeCompare(b.lastContactAt||""),
    next:(a,b)=>(a.nextActionAt||"9").localeCompare(b.nextActionAt||"9"),
    stage:(a,b)=>(STAGE_I[b.stage]||0)-(STAGE_I[a.stage]||0)||a.name.localeCompare(b.name,"et")};
  return list.sort(by[f.sort]||by.name);
}

  const work=S.venues.filter(v=>!v.archive);

    h+=`<div class="col" data-col="${k}"><div class="col-h"><span>${l}</span><span class="mono">${items.length}</span></div>${items.map(v=>`<div class="card" draggable="true" data-drag="${v.id}" data-open="${v.id}" tabindex="0" role="button"><b>${esc(v.name)}</b><div class="meta"><span>${stHTML(v)}</span><span>${k==="sample"&&v.sampleAt?"образец "+fmt(v.sampleAt):(isCust(v)?"заказ "+fmt(v.lastOrderAt):"контакт "+fmt(v.lastContactAt))}</span></div>${v.nextAction?`<div class="nx">${esc(v.nextAction)}</div>`:""}</div>`).join("")}</div>`;

function viewSheet(){
  return `<h1>Шпаргалка</h1><div class="sheet">
  <div class="panel"><h2>Цены без НДС</h2><div class="tbl-wrap"><table><thead><tr><th>Размер</th><th>Цена</th><th>Пачка</th><th>Пачка, €</th></tr></thead><tbody>
  ${SKUS.map(s=>`<tr><td>${s[1]}</td><td class="num">${eur(s[2])}</td><td class="num">${s[3]?s[3]+" шт":"поштучно"}</td><td class="num">${s[3]?eur(s[2]*s[3]):"—"}</td></tr>`).join("")}
  <tr><td>Скульптурный блок / кастом</td><td colspan="3">по запросу, цену согласует Ян</td></tr></tbody></table></div>
  <p class="small muted">Минимального заказа нет. Заказы считаем в штуках.</p></div>
  <div class="panel"><h2>Доставка и сроки</h2><ul>
   <li>Доставки клиентам — по <b>четвергам</b>.</li>
   <li>Стандарт (кубы 5×5×5, 5×6×5, Collins) — заказ за 1 день, то есть до среды.</li>
   <li>Нестандарт и сферы большим объёмом — 7–10 дней до склада.</li>
   <li>Таллинн: <span class="mono">8 € + KM</span> за каждую доставку.</li>
   <li>За пределами Таллинна — цену и срок подтверждает Ян (Тарту однажды стоил 40 €, это не тариф).</li>
   <li>Морозильник — без ограничений; термобокс — не больше 2 часов.</li>
   <li>Заказ от 500 шт — повод обсудить индивидуальные условия (только с одобрения Яна).</li>
  </ul></div>
  <div class="panel"><h2>Образцы</h2><ul>
   <li>Образец и его доставка по Таллинну — <b>бесплатно</b>. Это можно прямо писать клиенту.</li>
   <li>Привожу лично, 2–4 шт. каждой позиции, в удобное клиенту время.</li>
   <li>Через 3 дня без фидбека — пишу сам (CRM подскажет).</li>
   <li>Образец не обязателен: можно сразу первый заказ.</li>
  </ul></div>
  <div class="panel"><h2>Стадии и статусы</h2><ul>
   <li><b>Воронка:</b> Новый → Написали → Ответили → Образец → Первый заказ → Повторный → Регулярный.</li>
   <li><b>Отношения</b> (для клиентов): Активный · Под риском (от 4 нед. без заказа) · Спящий (от 6 нед.) · Потерян.</li>
   <li><b>Потерян</b> — только при подтверждении: отказ, ушли к другому поставщику, закрылись. Долгое молчание — это «Спящий».</li>
   <li><b>Архив:</b> Не писать · Закрыто · Не целевой · Дубликат · Клиент через группу (например, LP Hospitality заказывает через UMA).</li>
  </ul></div>
  <div class="panel"><h2>Как писать</h2><ul>
   <li>Пишу «<b>kristallselge kokteilijää</b>», не «selge».</li>
   <li>Коротко, один вопрос в конце, конкретный следующий шаг.</li>
   <li>Первым — эстонский; на английский или русский перехожу по желанию клиента.</li>
   <li>Только реальные факты: не выдумывать прошлые визиты и пробники.</li>
   <li>Для общих адресов: «Kui selle teemaga tegeleb teie juures keegi teine, palun edastage kiri talle.»</li>
   <li>Каждое письмо — через проверку humanizer перед отправкой.</li>
  </ul></div>
  <div class="panel"><h2>Ответы на возражения</h2><ul>
   <li><b>«Дороже обычного льда»</b> — плотный прозрачный лёд тает медленнее и меньше разбавляет напиток; сравнить на образце.</li>
   <li><b>«Уже берём у другого поставщика»</b> — предложить бесплатный образец и сравнить размер и цену (Art Priori: их латвийский 5×5×6 по 0,60 € против нашего 5×6×5 по 0,55 €).</li>
   <li><b>«Есть свой ледогенератор»</b> — наш лёд для премиальных коктейлей, генератор остаётся для остального.</li>
  </ul></div>
  <div class="panel"><h2>Не обещать без Яна</h2><ul>
   <li>Скидки, индивидуальные цены, бесплатную коммерческую доставку, отсрочку оплаты.</li>
   <li>Сроки крупных заказов и нестандартные изделия.</li>
   <li>Вопрос «где производится лёд?» — ответ согласует Ян. Не писать «наше производство в Эстонии».</li>
   <li>«Счёт отправлен» — только после подтверждения коллеги, который выставляет счета.</li>
  </ul></div>
  </div>`;
}

/* ---------- view: settings ---------- */
function viewSettings(){
  const s=S.settings;
  const row=(k,l,u)=>`<label class="f">${l}<input type="number" min="1" max="60" id="set-${k}" value="${esc(s[k])}"><span class="small muted">${u}</span></label>`;
  return `<h1>Правила подсказок</h1><div class="panel" style="max-width:640px"><div class="grid2">
  ${row("sampleDays","Фидбек по образцу через","дней после образца")}
  ${row("followUpDays","Follow-up после письма через","дней без ответа")}
  ${row("atRiskWeeks","«Под риском» после","недель без заказа")}
  ${row("dormantWeeks","«Спящий» после","недель без заказа")}
  ${row("riskRecontactDays","Не напоминать о клиенте под риском","дней после последнего контакта")}
  </div><div class="row"><button class="btn primary" data-act="saveSettings">Сохранить правила</button><span class="small muted">Ваша норма — заказ раз в 2–3 недели.</span></div></div>`;
}

/* ---------- drawer ---------- */
function openVenue(id){S.open=id;S.openMode="view";S.panel=null;S.editOrder=null;S.confirmDel=false;renderDrawer();}
function openNew(){S.open="__new";S.openMode="new";S.panel=null;renderDrawer();}
function closeDrawer(){S.open=null;$("#drawerRoot").innerHTML="";}
function field(id,label,val,type,cls){return `<label class="f ${cls||""}">${label}<input type="${type||"text"}" id="${id}" value="${esc(val)}"></label>`;}
function detailsForm(v){
  return `<div class="grid2">
   ${field("d-name","Название",v.name,"text","full")}
   ${field("d-aliases","Другие названия (через запятую)",(v.aliases||[]).join(", "),"text","full")}
   ${field("d-area","Район / адрес",v.area)}
   ${field("d-group","Группа / сеть",v.group)}
   ${field("d-segment","Тип заведения",v.segment)}
   <label class="f">Класс<select id="d-priority"><option value="">—</option>${PRIS.map(p=>`<option ${v.priority===p?"selected":""}>${p}</option>`).join("")}</select></label>
   ${field("d-contactName","Контактное лицо",v.contactName)}
   ${field("d-contactRole","Должность",v.contactRole)}
   ${field("d-email","Email",v.email,"email")}
   ${field("d-phone","Телефон",v.phone,"tel")}
   <label class="f">Язык общения<select id="d-lang">${[["et","Эстонский"],["en","Английский"],["ru","Русский"]].map(([k,l])=>`<option value="${k}" ${(v.lang||"et")===k?"selected":""}>${l}</option>`).join("")}</select></label>
   ${field("d-lastOrderAt","Последний заказ",v.lastOrderAt,"date")}
   <label class="f full">Заметки<textarea id="d-notes">${esc(v.notes)}</textarea></label>
  </div>`;
}
function readDetails(){
  const g=id=>($("#"+id)||{}).value||"";
  return {name:g("d-name").trim(),aliases:g("d-aliases").split(",").map(s=>s.trim()).filter(Boolean),area:g("d-area").trim(),group:g("d-group").trim(),segment:g("d-segment").trim(),priority:g("d-priority"),contactName:g("d-contactName").trim(),contactRole:g("d-contactRole").trim(),email:g("d-email").trim(),phone:g("d-phone").trim(),lang:g("d-lang")||"et",lastOrderAt:g("d-lastOrderAt"),notes:g("d-notes")};
}
function renderDrawer(){
  const root=$("#drawerRoot");
  if(!S.open){root.innerHTML="";return;}
  if(S.openMode==="new"){
    root.innerHTML=`<div class="scrim" data-act="close"></div><aside class="drawer" role="dialog" aria-label="Новое заведение"><div class="dr-h"><h1>Новое заведение</h1><button class="btn ghost" data-act="close">Закрыть</button></div><div class="dr-b">
    <div class="sec"><label class="f">Стадия<select id="d-stage">${STAGES.map(([k,l])=>`<option value="${k}">${l}</option>`).join("")}</select></label></div>
    ${detailsForm({lang:"et"})}<div class="row"><button class="btn primary" data-act="create">Добавить</button></div></div></aside>`;
    setTimeout(()=>{const n=$("#d-name");n&&n.focus();},30);
    return;
  }
  const v=vById(S.open);
  if(!v){root.innerHTML="";S.open=null;return;}
  const thu=nextThu(),lang=S.tplLang[v.id+":card"]||v.lang||"et",tk=S.tplLang[v.id+":cardkey"]||(v.stage==="sample"?"sample":isCust(v)?"thu":"follow");
  root.innerHTML=`<div class="scrim" data-act="close"></div><aside class="drawer" role="dialog" aria-label="${esc(v.name)}">
  <div class="dr-h"><div><h1>${esc(v.name)}</h1><p class="small muted">${esc([v.area,v.group,v.contactName].filter(Boolean).join(" · "))||"&nbsp;"}</p></div><button class="btn ghost" data-act="close">Закрыть</button></div>
  <div class="dr-b">
   <div class="sec"><h2>Стадия</h2><div class="stages">${STAGES.map(([k,l])=>`<button data-setstage="${k}" aria-pressed="${v.stage===k}">${l}</button>`).join("")}</div>
    <div class="grid2"><label class="f">Отношения${isCust(v)?"":" (для клиентов)"}<select id="d-rel">${REL.map(([k,l])=>`<option value="${k}" ${(v.relation||"")===k?"selected":""}>${l}</option>`).join("")}</select></label>
    <label class="f">Архив<select id="d-arch">${ARCH.map(([k,l])=>`<option value="${k}" ${(v.archive||"")===k?"selected":""}>${l}</option>`).join("")}</select></label></div>
    ${v.relation==="lost"?`<p class="small muted">«Потерян» — только при подтверждённой причине. Укажите её в заметках.</p>`:""}
   </div>
   <div class="sec"><h2>Следующий шаг</h2><div class="grid2"><label class="f full">Что сделать<input type="text" id="n-text" value="${esc(v.nextAction)}" placeholder="Например: позвонить бар-менеджеру"></label><label class="f">Когда<input type="date" id="n-date" value="${esc(v.nextActionAt)}"></label><div class="row" style="align-self:end"><button class="btn primary" data-act="saveNext">Сохранить шаг</button>${v.nextAction?`<button class="btn ghost" data-act="clearNext">Убрать</button>`:""}</div></div></div>
   <div class="sec"><h2>Действия</h2><div class="row">
     <button class="btn ${S.panel==="log"?"primary":""}" data-panel="log">Записать касание</button>
     <button class="btn ${S.panel==="sample"?"primary":""}" data-panel="sample">Образец доставлен</button>
     <button class="btn ${S.panel==="order"&&!S.editOrder?"primary":""}" data-panel="order">Добавить заказ</button>
     <button class="btn ${S.panel==="tpl"?"primary":""}" data-panel="tpl">Шаблон письма</button>
   </div>${panelHTML(v,thu,lang,tk)}</div>
   <div class="sec"><h2>История</h2><div id="tl">${timelineHTML(v)}</div></div>
   <div class="sec"><h2>Данные</h2><div class="panel geo"><p class="small row">${hasXY(v)?`На карте: <span class="mono">${v.lat.toFixed(5)}, ${v.lon.toFixed(5)}</span>${v.geo==="approx"?' <span class="chip">примерно</span>':""}`:"Места на карте нет"}</p>
    <div class="row"><a class="btn" target="_blank" rel="noopener" href="${gmSearch(v)}">${hasXY(v)?"Открыть в Google Картах":"Найти в Google Картах"}</a><button class="btn ghost" data-pickv="${v.id}">${hasXY(v)?"Передвинуть на карте":"Указать на карте"}</button></div>
    <div class="row"><input type="text" id="g-paste" placeholder="Вставьте ссылку из Google Карт или координаты: 59.4370, 24.7536" aria-label="Ссылка Google Карт или координаты"><button class="btn primary" data-act="saveGeo">Сохранить место</button></div>
    <p class="small muted">В Google Картах нажмите на здание правой кнопкой (на телефоне — долгое нажатие) и скопируйте координаты, или скопируйте ссылку «Поделиться».</p></div>
   ${detailsForm(v)}<div class="row"><button class="btn primary" data-act="saveDetails">Сохранить данные</button></div></div>
   <div class="sec"><div class="row">${S.confirmDel?`<span class="small">Удалить «${esc(v.name)}» навсегда? Для отсева лучше поставить архив.</span><button class="btn danger" data-act="delYes">Удалить</button><button class="btn ghost" data-act="delNo">Отмена</button>`:`<button class="btn ghost danger" data-act="del">Удалить заведение</button>`}</div></div>
  </div></aside>`;
}
function panelHTML(v,thu,lang,tk){
  if(S.panel==="log") return `<div class="panel"><div class="grid2"><label class="f">Тип<select id="l-type">${ACT.filter(a=>a[0]!=="sample").map(([k,l])=>`<option value="${k}">${l}</option>`).join("")}</select></label><label class="f">Дата<input type="date" id="l-date" value="${today()}"></label><label class="f full">Что было<textarea id="l-text" placeholder="Коротко: о чём договорились, что ответили"></textarea></label></div><div class="row"><button class="btn primary" data-act="saveLog">Записать</button></div></div>`;
  if(S.panel==="sample") return `<div class="panel"><div class="grid2"><label class="f">Дата<input type="date" id="s-date" value="${today()}"></label><label class="f full">Что привёз, кому передал<textarea id="s-text" placeholder="Например: по 3 шт. каждого размера, передал бармену"></textarea></label></div><p class="small muted">Стадия станет «Образец», через ${S.settings.sampleDays} дн. появится подсказка спросить фидбек.</p><div class="row"><button class="btn primary" data-act="saveSample">Записать образец</button></div></div>`;
  if(S.panel==="order"){
    const eo=S.editOrder?S.orders.find(o=>o.id===S.editOrder):null,it=(eo&&eo.items)||{};
    return `<div class="panel" id="orderPanel">${eo?`<h3 style="margin:0">Изменить заказ</h3>`:""}<div class="grid2"><label class="f">Дата доставки<input type="date" id="o-date" value="${eo?esc(eo.deliveryDate||""):thu}"></label>${eo?`<label class="f">Статус<select id="o-status"><option value="planned" ${eo.status!=="delivered"?"selected":""}>запланирован</option><option value="delivered" ${eo.status==="delivered"?"selected":""}>доставлен</option></select></label><label class="f full">Заведение<select id="o-venue">${S.venues.slice().sort((a,b)=>(a.name||"").localeCompare(b.name||"")).map(x=>`<option value="${x.id}" ${x.id===eo.venueId?"selected":""}>${esc(x.name)}</option>`).join("")}</select></label>`:""}</div>${eo&&!eo.deliveryDate?`<p class="small muted">Дата неизвестна — поставьте четверг доставки.</p>`:""}
    <div class="skus">${SKUS.map(s=>`<span>${s[1]} <span class="pk">${eur(s[2])}</span></span><input type="number" min="0" step="1" id="o-${s[0]}" data-sku="${s[0]}" placeholder="шт" value="${it[s[0]]||""}" aria-label="${s[1]}, штук"><span class="pk" id="pk-${s[0]}">${s[3]?"пачка "+s[3]:"поштучно"}</span>`).join("")}</div>
    <label class="f">Другое (кастом, блоки)<input type="text" id="o-custom" placeholder="Например: 150 шт 4,3×4,3×6,3" value="${eo?esc(eo.custom||""):""}"></label>
    <label class="f">Заметка${eo?`<textarea id="o-note" rows="3">${esc(eo.note||"")}</textarea>`:`<input type="text" id="o-note" placeholder="Канал заказа, особые условия">`}</label>
    <p class="small mono" id="o-sum">Товар: 0,00 € + доставка 8,00 € (без НДС)</p>
    <div class="row"><button class="btn primary" data-act="saveOrder">${eo?"Сохранить изменения":"Добавить заказ"}</button>${eo?`<button class="btn ghost" data-act="cancelEditOrder">Отмена</button>`:""}</div></div>`;
  }
  if(S.panel==="tpl"){
    const key=v.id+":card";
    return `<div class="panel tpl"><div class="tpl-bar"><select id="t-key" aria-label="Шаблон" style="width:auto">${Object.entries(TPL).map(([k,t])=>`<option value="${k}" ${tk===k?"selected":""}>${t.label}</option>`).join("")}</select><div class="seg" role="group" aria-label="Язык">${["et","en","ru"].map(l=>`<button data-cardlang="${l}" aria-pressed="${lang===l}">${l.toUpperCase()}</button>`).join("")}</div><button class="btn" data-copy="${key}">Копировать</button></div><textarea id="tpl-${esc(key)}" aria-label="Текст письма">${esc(tplText(tk,v,lang))}</textarea><p class="small muted">После отправки нажмите «Записать касание» → Письмо.</p></div>`;
  }
  return "";
}
function timelineHTML(v){
  const items=[...S.acts.filter(a=>a.venueId===v.id).map(a=>({d:a.date,c:a.createdAt||"",kind:"act",a})),...ordersFor(v.id).map(o=>({d:o.deliveryDate||"",c:o.createdAt||"",kind:"order",o}))]
    .sort((x,y)=>(y.d||"").localeCompare(x.d||"")||(y.c||"").localeCompare(x.c||""));
  if(!items.length) return `<p class="small muted">Пока пусто. Записывайте письма, звонки, образцы и заказы — по ним работают подсказки.</p>`;
  return `<div class="timeline">${items.map(x=>x.kind==="act"
    ?`<div class="ti"><span class="d">${fmt(x.d)} · ${ACT_L[x.a.type]||x.a.type}</span>${x.a.text?`<span class="t">${esc(x.a.text)}</span>`:""}<button class="del" data-delact="${x.a.id}">удалить</button></div>`
    :`<div class="ti order"><span class="d">${fmt(x.d)} · Заказ${x.o.deliveryDate?" (доставка)":""}</span><span class="t">${esc(orderLine(x.o))}${x.o.note?"\n"+esc(x.o.note):""}</span><span class="row" style="gap:10px"><button class="del" data-editorder="${x.o.id}">изменить</button><button class="del" data-delorder="${x.o.id}">удалить</button></span></div>`).join("")}</div>`;
}
function refreshTimeline(){const v=vById(S.open);const el=$("#tl");if(v&&el) el.innerHTML=timelineHTML(v);}
function orderSum(){
  let sum=0;
  for(const s of SKUS){const el=$("#o-"+s[0]);const q=el?Number(el.value)||0:0;sum+=q*s[2];
    const pk=$("#pk-"+s[0]);if(pk) pk.textContent=q?packStr(q,s[3]):`${s[3]?"пачка "+s[3]:"поштучно"}`;}
  const el=$("#o-sum");if(el) el.textContent=`Товар: ${eur(sum)} + доставка 8,00 € (без НДС)`;
}

const mY=lat=>Math.log(Math.tan(Math.PI/4+lat*Math.PI/360))*180/Math.PI;
const iY=y=>(Math.atan(Math.exp(y*Math.PI/180))-Math.PI/4)*360/Math.PI;
const hasXY=v=>v&&typeof v.lat==="number"&&typeof v.lon==="number";
function hav(a,b){const R=6371,r=Math.PI/180,dLa=(b.lat-a.lat)*r,dLo=(b.lon-a.lon)*r;const x=Math.sin(dLa/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.sqrt(x));}

/* map engine: one live canvas at a time */
const M={el:null,cv:null,ctx:null,W:0,H:0,ptrs:new Map(),moved:false,route:null,onPick:null,ro:null};
function cssv(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function mapFit(pts){
  const st=M.view;
  if(st.z&&st.lon!=null) return;
  let a=pts.length?pts:[{lon:24.55,lat:59.36},{lon:24.93,lat:59.50}];
  let x0=Math.min(...a.map(p=>p.lon)),x1=Math.max(...a.map(p=>p.lon)),y0=Math.min(...a.map(p=>mY(p.lat))),y1=Math.max(...a.map(p=>mY(p.lat)));
  if(x1-x0<0.01){x0-=0.01;x1+=0.01;} if(y1-y0<0.01){y0-=0.01;y1+=0.01;}
  st.lon=(x0+x1)/2;st.lat=iY((y0+y1)/2);st.z=Math.min((M.W-40)/(x1-x0),(M.H-40)/(y1-y0));
}
function px(lon,lat){const st=M.view;return [(lon-st.lon)*st.z+M.W/2,(mY(st.lat)-mY(lat))*st.z+M.H/2];}
function unpx(x,y){const st=M.view;return {lon:st.lon+(x-M.W/2)/st.z,lat:iY(mY(st.lat)-(y-M.H/2)/st.z)};}
function mapLayers(){
  const f=S.map.f,out=[];
  if(M.route){for(const s of M.route) if(s.v&&hasXY(s.v)) out.push({k:"route",v:s.v,n:s.n});return out;}
  if(f.osm) for(const p of S.places) if(!p.crmId&&hasXY(p)) out.push({k:"osm",p});
  for(const v of S.venues){const k=vKind(v);if(f[k]&&hasXY(v)) out.push({k,v});}

}
function drawMap(){

  c.fillStyle=cssv("--map-bg");c.fillRect(0,0,M.W,M.H);
  c.beginPath();TLN.forEach(([lo,la],i)=>{const [x,y]=px(lo,la);i?c.lineTo(x,y):c.moveTo(x,y);});c.closePath();
  c.fillStyle=cssv("--map-land");c.fill();c.strokeStyle=cssv("--line");c.lineWidth=1.5;c.stroke();
  const z=M.view.z;
  c.font="500 12px "+cssv("--f-body");c.textAlign="center";c.fillStyle=cssv("--ink-3");

  if(M.route){

    c.strokeStyle=col.route;c.lineWidth=2.5;c.setLineDash([6,5]);c.stroke();c.setLineDash([]);
    if(typeof st.startLat==="number"){const [x,y]=px(st.startLon,st.startLat);c.fillStyle=cssv("--ink");c.fillRect(x-6,y-6,12,12);}
  }
  for(const m of L){
    if(m.k==="osm"){const [x,y]=px(m.p.lon,m.p.lat);c.beginPath();c.arc(x,y,3,0,7);c.fillStyle=col.osm;c.globalAlpha=.6;c.fill();c.globalAlpha=1;}
  }

    if(m.k==="osm") continue;

function hitTest(x,y){
  let best=null,bd=14;
  for(const m of mapLayers()){const o=m.v||m.p;const [mx,my]=px(o.lon,o.lat);const d=Math.hypot(mx-x,my-y);if(d<bd){bd=d;best=m;}}

function mountMap(el,{route=null,fitPts=null,onPick=null,view=S.map}={}){
  if(M.ro){M.ro.disconnect();M.ro=null;}
  M.view=view;M.el=el;M.route=route;M.onPick=onPick;
  el.innerHTML=`<canvas aria-label="Карта заведений"></canvas><div class="mapctl"><button class="btn" data-mz="1" aria-label="Приблизить">+</button><button class="btn" data-mz="-1" aria-label="Отдалить">−</button><button class="btn" data-mz="0" aria-label="Показать всё">⤢</button></div><div class="mappop" id="mapPop" hidden></div>`;
  M.cv=el.querySelector("canvas");M.ctx=M.cv.getContext("2d");
  const size=()=>{const r=el.getBoundingClientRect(),dpr=window.devicePixelRatio||1;M.W=r.width;M.H=r.height;M.cv.width=Math.round(r.width*dpr);M.cv.height=Math.round(r.height*dpr);M.cv.style.width=r.width+"px";M.cv.style.height=r.height+"px";mapFit(fitPts||[]);drawMap();placePop();};
  size();M.ro=new ResizeObserver(size);M.ro.observe(el);

  cv.addEventListener("pointerdown",e=>{cv.setPointerCapture(e.pointerId);M.ptrs.set(e.pointerId,{x:e.offsetX,y:e.offsetY});M.moved=false;});
  cv.addEventListener("pointermove",e=>{
    const p=M.ptrs.get(e.pointerId);if(!p) return;
    if(M.ptrs.size===1){const dx=e.offsetX-p.x,dy=e.offsetY-p.y;if(Math.abs(dx)+Math.abs(dy)>2) M.moved=true;
      const st=M.view;st.lon-=dx/st.z;st.lat=iY(mY(st.lat)+dy/st.z);}
    else if(M.ptrs.size===2){const [a,b]=[...M.ptrs.values()];const d0=Math.hypot(a.x-b.x,a.y-b.y);p.x=e.offsetX;p.y=e.offsetY;const [a2,b2]=[...M.ptrs.values()];const d1=Math.hypot(a2.x-b2.x,a2.y-b2.y);if(d0>0) zoomAt((a2.x+b2.x)/2,(a2.y+b2.y)/2,d1/d0);M.moved=true;}
    p.x=e.offsetX;p.y=e.offsetY;drawMap();placePop();
  });
  const up=e=>{const had=M.ptrs.has(e.pointerId);M.ptrs.delete(e.pointerId);if(had&&!M.moved&&M.ptrs.size===0) mapClick(e.offsetX,e.offsetY);};

}
function zoomAt(x,y,f){const st=M.view,before=unpx(x,y);st.z=Math.max(800,Math.min(400000,st.z*f));const after=unpx(x,y);st.lon+=before.lon-after.lon;st.lat=iY(mY(st.lat)+mY(before.lat)-mY(after.lat));}

}

function mlUpdate(){
  if(!ML.ready) return;
  const m=ML.map,f=S.map.f,route=ML.mode==="route";

  ["bars-pt","bars-lbl","crm-pt","crm-lbl"].forEach(l=>vis(l,!route));["route-line","route-pt","route-num","route-lbl"].forEach(l=>vis(l,route));

    m.getSource("bars").setData(fc(f.osm?barsVisible().map(b=>ptF(b.lon,b.lat,{id:b.id,name:b.name,t:"b"})):[]));
    m.getSource("crm").setData(fc(S.venues.filter(v=>hasXY(v)&&f[vKind(v)]).map(v=>ptF(v.lon,v.lat,{id:v.id,name:v.name,k:vKind(v),sel:!!(S.map.sel&&S.map.sel.id===v.id),t:"v"}))));

function parseGeo(t){
  t=(t||"").trim();if(!t) return null;
  const pats=[/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/,/@(-?\d+\.\d+),(-?\d+\.\d+)/,/[?&](?:q|query|ll|center|destination)=(-?\d+\.\d+)(?:,|%2C)\s*(-?\d+\.\d+)/i,/(-?\d{1,2}\.\d{3,})\s*[,;\s]\s*(-?\d{1,3}\.\d{3,})/];
  for(const re of pats){const m=t.match(re);if(m){const lat=+m[1],lon=+m[2];if(lat>57&&lat<60.5&&lon>21&&lon<29) return {lat:Math.round(lat*1e6)/1e6,lon:Math.round(lon*1e6)/1e6};if(lat>-90&&lat<90&&lon>-180&&lon<180) return {lat,lon,far:true};}}

}

/* ---------- road routing on the OpenStreetMap road network (graph.json) ---------- */
const RG={p:null,ok:false,lon:null,lat:null,off:null,adjB:null,adjL:null,adjE:null,eA:null,eB:null,eFlat:null,grid:null,cache:{}};
function loadGraph(){
  if(RG.p) return RG.p;
  RG.p=fetch("graph.json").then(r=>{if(!r.ok) throw new Error("graph "+r.status);return r.json();}).then(g=>{
    const n=g.nodes.length,E=g.edges;RG.lon=new Float64Array(n);RG.lat=new Float64Array(n);
    g.nodes.forEach(([x,y],i)=>{RG.lon[i]=x/1e5;RG.lat[i]=y/1e5;});
    const deg=new Int32Array(n);for(const e of E){deg[e[0]]++;deg[e[1]]++;}
    RG.off=new Int32Array(n+1);for(let i=0;i<n;i++) RG.off[i+1]=RG.off[i]+deg[i];
    const m=RG.off[n],pos=RG.off.slice(0,n);RG.adjB=new Int32Array(m);RG.adjL=new Float32Array(m);RG.adjE=new Int32Array(m);
    RG.eA=new Int32Array(E.length);RG.eB=new Int32Array(E.length);RG.eFlat=new Array(E.length);
    E.forEach((e,k)=>{const [a,b,l,,flat]=e;RG.eA[k]=a;RG.eB[k]=b;RG.eFlat[k]=flat;
      RG.adjB[pos[a]]=b;RG.adjL[pos[a]]=l;RG.adjE[pos[a]]=k;pos[a]++;RG.adjB[pos[b]]=a;RG.adjL[pos[b]]=l;RG.adjE[pos[b]]=k;pos[b]++;});
    RG.grid=new Map();for(let i=0;i<n;i++){const k=Math.floor(RG.lon[i]*200)+":"+Math.floor(RG.lat[i]*400);let a=RG.grid.get(k);if(!a) RG.grid.set(k,a=[]);a.push(i);}
    RG.ok=true;return true;
  }).catch(e=>{console.warn("road graph:",e);RG.ok=false;return false;});
  return RG.p;
}
function rgNearest(p){
  const cx=Math.floor(p.lon*200),cy=Math.floor(p.lat*400);let best=-1,bd=1e9;
  for(let r=1;r<=3&&best<0;r++){for(let dx=-r;dx<=r;dx++)for(let dy=-r;dy<=r;dy++){const a=RG.grid.get((cx+dx)+":"+(cy+dy));if(!a) continue;for(const i of a){const d=hav(p,{lat:RG.lat[i],lon:RG.lon[i]});if(d<bd){bd=d;best=i;}}}}
  return best>=0&&bd<0.6?best:-1;
}
function rgDijkstra(src,targets){
  const n=RG.lon.length,dist=new Float64Array(n).fill(Infinity),prevE=new Int32Array(n).fill(-1),need=new Set(targets);
  dist[src]=0;const H=[[0,src]];
  const push=x=>{H.push(x);let i=H.length-1;while(i>0){const p=(i-1)>>1;if(H[p][0]<=H[i][0]) break;[H[p],H[i]]=[H[i],H[p]];i=p;}};
  const pop=()=>{const top=H[0],last=H.pop();if(H.length){H[0]=last;let i=0;for(;;){const l=2*i+1,r=l+1;let m=i;if(l<H.length&&H[l][0]<H[m][0]) m=l;if(r<H.length&&H[r][0]<H[m][0]) m=r;if(m===i) break;[H[m],H[i]]=[H[i],H[m]];i=m;}}return top;};
  while(H.length){const [d,u]=pop();if(d>dist[u]) continue;need.delete(u);if(!need.size) break;
    for(let j=RG.off[u];j<RG.off[u+1];j++){const v=RG.adjB[j],nd=d+RG.adjL[j];if(nd<dist[v]){dist[v]=nd;prevE[v]=RG.adjE[j];push([nd,v]);}}}
  return {dist,prevE};
}
function rgPath(res,src,dst){
  const out=[];let v=dst,guard=0;
  while(v!==src&&guard++<200000){const e=res.prevE[v];if(e<0) return null;const a=RG.eA[e],b=RG.eB[e],from=v===b?a:b;
    const pts=[[RG.lon[a],RG.lat[a]]];let x=Math.round(RG.lon[a]*1e5),y=Math.round(RG.lat[a]*1e5);const f=RG.eFlat[e];
    for(let i=0;i<f.length;i+=2){x+=f[i];y+=f[i+1];pts.push([x/1e5,y/1e5]);}pts.push([RG.lon[b],RG.lat[b]]);
    if(v===a) pts.reverse();out.push(pts);v=from;}
  out.reverse();const flat=[];for(const seg of out){for(const p of (flat.length?seg.slice(1):seg)) flat.push(p);}return flat;
}
function routePoints(stops){const st=S.settings;return [...(typeof st.startLat==="number"?[{lat:st.startLat,lon:st.startLon}]:[]),...stops.filter(s=>s.v&&hasXY(s.v)).map(s=>({lat:s.v.lat,lon:s.v.lon}))];}
function roadRoute(stops){
  const pts=routePoints(stops);if(pts.length<2) return {km:0,coords:pts.map(p=>[p.lon,p.lat]),road:true,missing:0};
  const sig=pts.map(p=>p.lat.toFixed(5)+","+p.lon.toFixed(5)).join(";");if(RG.cache[sig]) return RG.cache[sig];
  if(!RG.ok) return null;
  let km=0,coords=[],missing=0;
  for(let i=0;i<pts.length-1;i++){const a=pts[i],b=pts[i+1],na=rgNearest(a),nb=rgNearest(b);let seg=null,len=0;
    if(na>=0&&nb>=0){if(na===nb){seg=[];}else{const r=rgDijkstra(na,[nb]);if(isFinite(r.dist[nb])){seg=rgPath(r,na,nb);len=r.dist[nb]/1000;}}}
    if(seg){const part=[[a.lon,a.lat],...seg,[b.lon,b.lat]];km+=len+hav(a,{lat:RG.lat[na],lon:RG.lon[na]})+hav(b,{lat:RG.lat[nb],lon:RG.lon[nb]});coords.push(...(coords.length?part.slice(1):part));}
    else{missing++;km+=hav(a,b)*1.3;coords.push(...(coords.length?[[b.lon,b.lat]]:[[a.lon,a.lat],[b.lon,b.lat]]));}}
  return RG.cache[sig]={km,coords,road:true,missing};
}
function roadMatrix(pts){
  const ids=pts.map(rgNearest),n=pts.length,M=[...Array(n)].map(()=>new Float64Array(n));
  for(let i=0;i<n;i++){if(ids[i]<0){for(let j=0;j<n;j++) M[i][j]=hav(pts[i],pts[j])*1.3;continue;}
    const r=rgDijkstra(ids[i],ids.filter(x=>x>=0));for(let j=0;j<n;j++) M[i][j]=i===j?0:(ids[j]>=0&&isFinite(r.dist[ids[j]])?r.dist[ids[j]]/1000:hav(pts[i],pts[j])*1.3);}
  return M;
}

/* ---------- deliveries & route ---------- */
function routeFor(date){return S.routes[date]||{seq:[],extra:[]};}
function stopsFor(date){
  const r=routeFor(date),stops=[];
  for(const o of S.orders.filter(o=>o.deliveryDate===date)) stops.push({key:"o:"+o.id,kind:"order",o,v:vById(o.venueId)});
  (r.extra||[]).forEach((x,i)=>stops.push({key:"x:"+x.venueId,kind:x.kind||"visit",x,xi:i,v:vById(x.venueId)}));
  const pos=k=>{const i=(r.seq||[]).indexOf(k);return i<0?1e6:i;};
  stops.sort((a,b)=>pos(a.key)-pos(b.key));
  stops.forEach((s,i)=>s.n=i+1);
  return stops;
}
async function saveRoute(date,patch){
  if(!guard()) return;
  const cur=routeFor(date);
  try{await S.db.doc("routes/"+date).set({seq:cur.seq||[],extra:cur.extra||[],...patch,updatedAt:new Date().toISOString()});}catch(e){fail(e);}
}
function optimize(stops){
  const st=S.settings,withXY=stops.filter(s=>s.v&&hasXY(s.v)),noXY=stops.filter(s=>!(s.v&&hasXY(s.v)));
  if(withXY.length<2) return stops.map(s=>s.key);
  const start=typeof st.startLat==="number"?{lat:st.startLat,lon:st.startLon}:null;
  const pts=[...(start?[start]:[]),...withXY.map(s=>({lat:s.v.lat,lon:s.v.lon}))],off=start?1:0;
  const M=RG.ok?roadMatrix(pts):pts.map(a=>pts.map(b=>hav(a,b)));
  const idx=withXY.map((_,i)=>i+off);
  let order=[],rest=[...idx],cur=start?0:rest.shift();if(!start) order.push(cur);
  while(rest.length){let bi=0,bd=Infinity;rest.forEach((j,k)=>{if(M[cur][j]<bd){bd=M[cur][j];bi=k;}});cur=rest.splice(bi,1)[0];order.push(cur);}
  const len=o=>{let L=0,prev=start?0:o[0];for(let k=start?0:1;k<o.length;k++){L+=M[prev][o[k]];prev=o[k];}return L;};
  let improved=true,g=0;
  while(improved&&g++<60){improved=false;for(let i=0;i<order.length-1;i++)for(let j=i+1;j<order.length;j++){const c=[...order.slice(0,i),...order.slice(i,j+1).reverse(),...order.slice(j+1)];if(len(c)+1e-9<len(order)){order=c;improved=true;}}}
  return [...order.map(i=>withXY[i-off].key),...noXY.map(s=>s.key)];
}
function routeKm(stops){const rr=roadRoute(stops);if(rr) return rr.km;const st=S.settings;const pts=[...(typeof st.startLat==="number"?[{lat:st.startLat,lon:st.startLon}]:[]),...stops.filter(s=>s.v&&hasXY(s.v)).map(s=>s.v)];return pts.slice(1).reduce((a,p,i)=>a+hav(pts[i],p),0)*1.3;}
function gmapsLinks(stops){
  const st=S.settings,ll=p=>p.lat.toFixed(6)+","+p.lon.toFixed(6);
  const pts=stops.filter(s=>s.v&&hasXY(s.v)).map(s=>s.v);
  if(!pts.length) return [];
  const start=typeof st.startLat==="number"?{lat:st.startLat,lon:st.startLon}:null;
  const all=start?[start,...pts]:pts;
  if(all.length<2) return [{label:"Открыть точку в Google Maps",url:"https://www.google.com/maps/search/?api=1&query="+ll(all[0])}];
  const out=[];let i=0,part=1;
  while(i<all.length-1){const chunk=all.slice(i,i+11);
    out.push({label:all.length>11?`Google Maps, часть ${part}`:"Открыть маршрут в Google Maps",
      url:"https://www.google.com/maps/dir/?api=1&travelmode=driving&origin="+ll(chunk[0])+"&destination="+ll(chunk[chunk.length-1])+(chunk.length>2?"&waypoints="+encodeURIComponent(chunk.slice(1,-1).map(ll).join("|")):"")});
    i+=chunk.length-1;part++;}
  return out;
}

function afterRender(){
  if(S.tab==="stats"){drawStats();return;}
  if(S.tab==="map"){const el=$("#mapBox");if(el&&!mlMount(el,"map")){const pts=S.venues.filter(v=>hasXY(v)&&!v.archive);mountMap(el,{fitPts:pts.length>2?pts:null});}}
  else if(S.tab==="deliveries"){const el=$("#routeMap");if(el){const stops=stopsFor(S.dDate);const pts=stops.filter(s=>s.v&&hasXY(s.v)).map(s=>s.v);if(typeof S.settings.startLat==="number") pts.push({lat:S.settings.startLat,lon:S.settings.startLon});
    if(!mlMount(el,"route",stops,pts)) mountMap(el,{route:stops,fitPts:pts,view:{lon:null,lat:null,z:null}});}}
}

/* ---------- events ---------- */

    return;}
  if(d.rmstop!=null){const date=S.dDate,r=routeFor(date),ex=(r.extra||[]).filter((x,i)=>i!==+d.rmstop);await saveRoute(date,{extra:ex});return;}
  switch(d.act){

    case "saveGeo":{const v=vById(S.open);const raw=($("#g-paste")||{}).value||"";const g=parseGeo(raw);

      if(!v){toast("Заведение не найдено — выберите из списка");break;}
      const date=S.dDate,r=routeFor(date);if((r.extra||[]).some(x=>x.venueId===v.id)){toast("Уже в маршруте");break;}
      S.addStopQ="";await saveRoute(date,{extra:[...(r.extra||[]),{venueId:v.id,kind:$("#addStopKind").value,note:""}]});toast(v.name+" добавлено");break;}

      try{const ref=await S.db.collection("venues").add(data);toast("Добавлено: "+data.name);openVenue(ref.id);}catch(err){fail(err);}break;}
    case "saveDetails":{const v=vById(S.open);const data=readDetails();if(!data.name){toast("Укажите название");break;}
      if(data.lastOrderAt&&isCust(v)&&(!v.relation)) data.relation="active";
      await upd(v.id,data);toast("Данные сохранены");break;}
    case "saveNext":{const v=vById(S.open);await upd(v.id,{nextAction:$("#n-text").value.trim(),nextActionAt:$("#n-date").value});toast("Следующий шаг сохранён");break;}
    case "clearNext":{const v=vById(S.open);await upd(v.id,{nextAction:"",nextActionAt:""});break;}
    case "saveLog":{const v=vById(S.open);const type=$("#l-type").value,text=$("#l-text").value.trim(),date=$("#l-date").value||today();await logAct(v,type,text,date);S.panel=null;toast("Записано");break;}
    case "saveSample":{const v=vById(S.open);await logAct(v,"sample",$("#s-text").value.trim(),$("#s-date").value||today());S.panel=null;toast("Образец записан");break;}
    case "cancelEditOrder":S.editOrder=null;S.panel=null;renderDrawer();break;
    case "saveOrder":{if(!guard()) break;const v=vById(S.open);const items={};let any=false;
      for(const s of SKUS){const q=Number(($("#o-"+s[0])||{}).value)||0;if(q>0){items[s[0]]=q;any=true;}}
      const custom=$("#o-custom").value.trim();if(!any&&!custom){toast("Укажите количество хотя бы по одной позиции");break;}

        try{await S.db.collection("orders").doc(eo.id).update(patch);
          const after=S.orders.map(o=>o.id===eo.id?{...o,...patch}:o);
          for(const vid of new Set([eo.venueId,nv])){const vv=vById(vid);if(!vv) continue;const last=after.filter(o=>o.venueId===vid&&o.deliveryDate&&o.deliveryDate<=addDays(today(),7)).map(o=>o.deliveryDate).sort().pop()||"";if(last!==(vv.lastOrderAt||"")) await upd(vid,{lastOrderAt:last});}
          S.editOrder=null;S.panel=null;if(nv!==S.open) openVenue(nv);else renderDrawer();toast("Заказ сохранён");}catch(err){fail(err);}break;}
      const date=$("#o-date").value||nextThu();
      try{await S.db.collection("orders").add({venueId:v.id,deliveryDate:date,items,custom,note:$("#o-note").value.trim(),createdAt:new Date().toISOString()});
        const patch={relation:"active"};if(!v.lastOrderAt||date>v.lastOrderAt) patch.lastOrderAt=date;

    case "noToggle":S.no=S.no?null:{date:S.dDate||nextThu(),items:{}};render();if(S.no){const el=$("#no-venue");if(el) el.focus();}break;

      const items={};let any=false;for(const s of SKUS){const k=Number((n.items||{})[s[0]])||0;if(k>0){items[s[0]]=Math.floor(k);any=true;}}

        if(v.managedBy!=="other") patch.relation="active";

        if(Object.keys(patch).length) await upd(v.id,patch);
        S.no=null;render();toast("Заказ добавлен: "+v.name+(date?" · "+fmt(date):""));}catch(err){fail(err);}break;}
    case "del":S.confirmDel=true;renderDrawer();break;
    case "delNo":S.confirmDel=false;renderDrawer();break;
    case "delYes":{if(!guard()) break;const id=S.open;closeDrawer();try{await S.db.collection("venues").doc(id).delete();toast("Заведение удалено");}catch(err){fail(err);}break;}
    case "saveSettings":{if(!guard()) break;const s={};for(const k of Object.keys(DEF)){const n=Number(($("#set-"+k)||{}).value);s[k]=n>0?n:DEF[k];}
      try{await S.db.doc("settings/main").set(s);toast("Правила сохранены");}catch(err){fail(err);}break;}
  }
});
document.addEventListener("change",async e=>{
  const id=e.target.id;
  if(e.target.dataset&&e.target.dataset.mf){S.map.f[e.target.dataset.mf]=e.target.checked;S.map.sel=null;if(ML.popup){ML.popup.remove();ML.popup=null;}mapRefresh();return;}
  if(id==="dDate"){S.dDate=e.target.value||nextThu();render();return;}
  if(id==="d-rel"){const v=vById(S.open);await upd(v.id,{relation:e.target.value});return;}
  if(id==="d-arch"){const v=vById(S.open);await upd(v.id,{archive:e.target.value});toast(e.target.value?"Перенесено в архив: "+ARCH_L[e.target.value]:"Возвращено в работу");return;}
  if(id==="t-key"){const v=vById(S.open);S.tplLang[v.id+":cardkey"]=e.target.value;renderDrawer();return;}
  const map={fstage:"stage",fpri:"pri",farch:"arch",fsort:"sort"};
  if(map[id]){S.f[map[id]]=e.target.value;render();}
});
document.addEventListener("input",e=>{
  if(e.target.id==="fq"){S.f.q=e.target.value;const pos=e.target.selectionStart;render();const n=$("#fq");if(n){n.focus();try{n.setSelectionRange(pos,pos);}catch(_){}}return;}
  if(e.target.dataset&&e.target.dataset.sku) orderSum();

  if(e.target.id==="pc-sku"){S.pc=S.pc||{q:""};S.pc.sku=e.target.value;const s=SKUS.find(x=>x[0]===e.target.value);if(s){S.pc.n=s[3];const ni=$("#pc-n");if(ni) ni.value=s[3];}const o=$("#pc-out");if(o) o.innerHTML=packCalcOut();return;}
  if(e.target.id==="addStopQ") S.addStopQ=e.target.value;
  if(S.no&&e.target.id&&e.target.id.startsWith("no-")){const id=e.target.id.slice(3);if(e.target.dataset.nosku){S.no.items=S.no.items||{};S.no.items[id]=e.target.value;const s=SKUS.find(x=>x[0]===id),pk=$("#nopk-"+id),q=Number(e.target.value)||0;if(pk&&s) pk.textContent=q?packStr(q,s[3]):(s[3]?"пачка "+s[3]:"поштучно");}else{S.no[id]=e.target.value;if(id==="date"&&e.target.value&&e.target.value<today()){S.no.status="delivered";const st=$("#no-status");if(st) st.value="delivered";}}return;}

document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){const box=$("#sres");if(box&&!box.hidden){box.hidden=true;return;}if(S.open) closeDrawer();}
  if((e.key==="Enter"||e.key===" ")&&e.target.matches&&e.target.matches("[role=button][data-open]")){e.preventDefault();openVenue(e.target.dataset.open);}
});
/* drag & drop on board */
document.addEventListener("dragstart",e=>{const c=e.target.closest&&e.target.closest("[data-drag]");if(c){e.dataTransfer.setData("text/plain",c.dataset.drag);e.dataTransfer.effectAllowed="move";}});
document.addEventListener("dragover",e=>{const col=e.target.closest&&e.target.closest("[data-col]");if(col){e.preventDefault();document.querySelectorAll(".col.over").forEach(x=>x!==col&&x.classList.remove("over"));col.classList.add("over");}});
document.addEventListener("dragleave",e=>{const col=e.target.closest&&e.target.closest("[data-col]");if(col&&!col.contains(e.relatedTarget)) col.classList.remove("over");});
document.addEventListener("drop",async e=>{const col=e.target.closest&&e.target.closest("[data-col]");if(!col) return;e.preventDefault();col.classList.remove("over");const id=e.dataTransfer.getData("text/plain");const v=vById(id);if(v&&v.stage!==col.dataset.col){await upd(id,{stage:col.dataset.col});toast(v.name+" → "+STAGE_L[col.dataset.col]);}});

function renderSearch(q){
  const box=$("#sres");if(!box) return;q=(q||"").trim().toLowerCase();
  if(q.length<2){box.hidden=true;box.innerHTML="";return;}
  const res=S.venues.filter(v=>[v.name,...(v.aliases||[]),v.contactName,v.email,v.area,v.phone].join(" ").toLowerCase().includes(q)).slice(0,8);
  box.innerHTML=res.length?res.map(v=>`<button data-open="${v.id}" data-sres="1"><span><b>${esc(v.name)}</b> <span class="small muted">${esc([v.contactName,v.area].filter(Boolean).join(" · "))}</span></span>${stHTML(v)}</button>`).join(""):`<p class="small muted" style="padding:8px 10px">Ничего не найдено</p>`;
  box.hidden=false;
}
document.addEventListener("click",e=>{const box=$("#sres");if(box&&!box.hidden&&!e.target.closest(".search")){box.hidden=true;}if(e.target.closest("[data-sres]")){const g=$("#gq");if(g) g.value="";if(box) box.hidden=true;}},true);
try{const th=localStorage.getItem("icc_theme");if(th) document.documentElement.dataset.theme=th;}catch(e){}
/* ---------- boot ---------- */
render();
(async()=>{
  let db=null;
  try{const c=await window.CRM.connect();db=c.db;if(c.role==="viewer") S.readonly=true;}catch(e){console.error(e);db=null;}
  if(!db){S.nodb=true;render();return;}
  S.db=db;
  const err=e=>{console.error(e);if(e&&e.code==="revoked"){S.nodb=true;render();}};
  db.collection("venues").onSnapshot(s=>{S.venues=s.docs.map(d=>({id:d.id,...d.data()}));S.loaded.v=true;render();if(S.open&&S.openMode==="view"){if(!vById(S.open)) closeDrawer();else if(!document.activeElement||!document.activeElement.closest||!document.activeElement.closest("aside.drawer input,aside.drawer textarea,aside.drawer select")) renderDrawer();else refreshTimeline();}},err);
  db.collection("activities").onSnapshot(s=>{S.acts=s.docs.map(d=>({id:d.id,...d.data()}));S.loaded.a=true;refreshTimeline();if(S.tab==="stats") render();},err);
  db.collection("orders").onSnapshot(s=>{S.orders=s.docs.map(d=>({id:d.id,...d.data()}));S.loaded.o=true;render();refreshTimeline();},err);
  db.collection("places").onSnapshot(s=>{S.places=s.docs.map(d=>({id:d.id,...d.data()}));if(S.tab==="map") render();},err);
  db.collection("drafts").onSnapshot(s=>{S.drafts=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.createdAt||"").localeCompare(a.createdAt||""));if(S.tab==="today"||S.tab==="agents"||S.tab==="marketing") render();},err);
  db.collection("agentlog").onSnapshot(s=>{S.agentlog=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.at||"").localeCompare(a.at||""));if(S.tab==="agents") render();},err);
  db.collection("proposals").onSnapshot(s=>{S.proposals=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.createdAt||"").localeCompare(a.createdAt||""));if(S.tab==="agents"||S.tab==="today") render();},err);
  db.collection("kb").onSnapshot(s=>{const k={};s.docs.forEach(d=>{k[d.id]=d.data();});S.kb=k;if(S.tab==="agents") render();},err);
  db.collection("tasks").onSnapshot(s=>{S.gtasks=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.due||"9").localeCompare(b.due||"9"));if(S.tab==="today"||S.tab==="stats") render();},err);
  db.collection("routes").onSnapshot(s=>{const r={};s.docs.forEach(d=>{r[d.id]=d.data();});S.routes=r;if(S.tab==="deliveries") render();},err);
  db.doc("settings/main").onSnapshot(s=>{S.settings={...DEF,...(s.exists?s.data():{})};render();},err);
})();
})();
</script>

</body></html>
